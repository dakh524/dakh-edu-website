<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#1a0b2e"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" rx="40" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Ambient Glowing Blobs -->
  <circle cx="200" cy="250" r="280" fill="#9333ea" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="1700" cy="350" r="320" fill="#3b82f6" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="1400" cy="850" r="260" fill="#ec4899" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Decorative Border Frame -->
  <rect x="40" y="40" width="1840" height="1000" rx="32" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Top Pill: DAKH OFFICIAL ANNOUNCEMENT -->
  <g transform="translate(120, 120)">
    <rect width="380" height="54" rx="27" fill="#ffffff" fill-opacity="0.08" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="32" cy="27" r="7" fill="#10b981"/>
    <text x="54" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f1f5f9" letter-spacing="3">DAKH TECH ECOSYSTEM</text>
  </g>

  <!-- Flash Offer Tag -->
  <g transform="translate(520, 120)">
    <rect width="320" height="54" rx="27" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#fbbf24" letter-spacing="2">🔥 SPECIAL OFFER LIVE</text>
  </g>

  <!-- Main Headline -->
  <text x="120" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#94a3b8" letter-spacing="4">KICKSTART YOUR TECH CAREER</text>
  
  <text x="120" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#ffffff" letter-spacing="-1">
    INTERNSHIP <tspan fill="url(#accentGrad)">PROGRAM</tspan>
  </text>

  <!-- Pricing Callout Box -->
  <g transform="translate(120, 480)">
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#cbd5e1">Special Offer Flat Fee:</text>
    <text x="420" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#64748b" text-decoration="line-through">₹499</text>
    <text x="550" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="84" font-weight="900" fill="url(#goldGrad)" filter="url(#glow)">₹399</text>
    <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#a855f7" letter-spacing="1">[ ONLINE &amp; OFFLINE ]</text>
  </g>

  <!-- Feature Highlights Row -->
  <g transform="translate(120, 650)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="380" height="90" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <text x="30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#38bdf8">⚡ 10+ Tech Domains</text>
      <text x="30" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Web, AI, App, Cloud, Python</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(410, 0)">
      <rect width="380" height="90" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <text x="30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#a855f7">🏆 Verified Certificate</text>
      <text x="30" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">With Unique Verification Code</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(820, 0)">
      <rect width="380" height="90" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <text x="30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#34d399">🚀 Real Production Code</text>
      <text x="30" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Build Live Capstone Projects</text>
    </g>
  </g>

  <!-- Big Call To Action Button -->
  <g transform="translate(120, 810)">
    <rect width="460" height="96" rx="48" fill="url(#btnGrad)" filter="url(#glow)"/>
    <text x="230" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="1">
      CLAIM ₹399 OFFER →
    </text>
  </g>

  <!-- Right Visual 3D Badge Graphic -->
  <g transform="translate(1380, 260)">
    <!-- Floating Hexagon Backing -->
    <polygon points="220,20 400,120 400,340 220,440 40,340 40,120" fill="url(#accentGrad)" opacity="0.15" stroke="url(#accentGrad)" stroke-width="3"/>
    <!-- Inner Glowing Circle -->
    <circle cx="220" cy="230" r="150" fill="#0f172a" stroke="#a855f7" stroke-width="4"/>
    <!-- Discount Burst Badge -->
    <circle cx="220" cy="230" r="130" fill="#7c3aed" fill-opacity="0.3"/>
    <text x="220" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#fbbf24" letter-spacing="3">FLAT DISCOUNT</text>
    <text x="220" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#ffffff">₹399</text>
    <text x="220" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#38bdf8" letter-spacing="2">ALL MODES INCLUDED</text>
    <!-- Floating Sparkles -->
    <circle cx="60" cy="80" r="6" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="380" cy="90" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="390" cy="380" r="6" fill="#ec4899" filter="url(#glow)"/>
  </g>
</svg>